  - {id: gold_mining,       name: Gold & Mining,          group: theme, etf: GDX,  members: [NEM, AEM, WPM, FNV, KGC, GOLD, AU, GFI]}
  - {id: cloud_software,    name: Cloud & Software,       group: theme, etf: IGV,  members: [MSFT, CRM, NOW, ADBE, INTU, SNOW, DDOG, WDAY]}
  - {id: homebuilders,      name: Homebuilders,           group: theme, etf: ITB,  members: [DHI, LEN, NVR, PHM, TOL, KBH, TMHC, MTH]}
