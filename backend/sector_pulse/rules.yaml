# Headline sources used to detect events (GDELT is free and keyless; Yahoo news for the tickers below).
event_sources:
  macro_tickers: [SPY, USO, ITA, XLE, TLT, GLD]
  gdelt:
    enabled: true
    timespan: 24h
    max_records: 40
    max_seconds: 150        # hard cap for the whole GDELT stage so rate limits cannot stall a run
    stop_after_failures: 3  # give up after this many consecutive failed event types
    sleep_seconds: 6.0    # GDELT asks for at most one request every 5 seconds

# How many headlines/outlets it takes before a detected event is rated High / Med.
event_detection:
  high_sources: 3
  high_headlines: 5
  med_headlines: 2
  max_headlines_kept: 3
